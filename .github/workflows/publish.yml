name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Build package
      run: uv build

    - name: Smoke test (wheel)
      run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
    - name: Smoke test (source distribution)
      run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish distribution to pypi
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fstar-compare  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to pypi
      uses: pypa/gh-action-pypi-publish@release/v1

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    - name: Download distributions artifact
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Generate PEP 740 attestations
      uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

    - name: Publish
      run: uv publish

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "fstar"
version = "0.0.2"
authors = [{ name="Ryan DeWolfe", email="ryan.dewolfe@uwaterloo.ca" }]
description = "A pragmatic method for comparing clusterings with ovalaps and outliers."
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
experiments = [
    "abcd-graph",
    "clusim>=0.4",
    "egosplit-sknetwork>=0.0.4",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "scikit-network>=0.33.5",
    "tqdm>=4.70.1",
]

[project.urls]
Homepage = "https://github.com/ryandewolfe33/fstar"
Repository = "https://github.com/ryandewolfe33/fstar"

[tool.uv.build-backend]
module-name = "fstar"
module-root = ""

[tool.uv.sources]
clusim = { git = "https://github.com/Hoosier-Clusters/clusim" }
abcd-graph = { git = "https://github.com/ryandewolfe33/abcd-graph", branch = "release/0.5.0-beta" }

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".git",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify (helps write simpler code)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905", # Do not require strict in zip, not compatible with numba
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "fstar"
version = "0.0.2"
authors = [{ name="Ryan DeWolfe", email="ryan.dewolfe@uwaterloo.ca" }]
description = "A pragmatic method for comparing clusterings with ovalaps and outliers."
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.12"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.10",
]

[project.urls]
Homepage = "https://github.com/ryandewolfe33/fstar"
Repository = "https://github.com/ryandewolfe33/fstar"

[tool.uv.build-backend]
module-name = "fstar"
module-root = ""
